name: Xbox news

on:
  schedule:
    - cron: "*/15 * * * *"   # forum notizie + big news del giorno (dopo le 17 UTC, una volta)
  workflow_dispatch:

permissions:
  actions: write   # serve solo per il keepalive sotto

jobs:
  notizie:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python xbox.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      # GitHub spegne i workflow programmati dopo 60 giorni senza attività: riattivarlo azzera il conteggio
      - run: gh workflow enable xbox.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
