name: Xbox news

on:
  schedule:
    - cron: "*/15 * * * *"   # forum notizie, ogni 15 minuti
    - cron: "0 17 * * *"     # big news del giorno in #generale (18:00 in Italia d'inverno)
  workflow_dispatch:

permissions:
  actions: write   # serve solo per il keepalive sotto

jobs:
  notizie:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python xbox.py
        if: github.event.schedule != '0 17 * * *'
      - run: python xbox.py --giornaliera
        if: github.event.schedule == '0 17 * * *'
      # GitHub spegne i workflow programmati dopo 60 giorni senza attività: riattivarlo azzera il conteggio
      - run: gh workflow enable xbox.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
